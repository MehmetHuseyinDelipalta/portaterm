<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <!-- Portal ring, with a gap where the orbiting dot sits -->
  <path d="M16.23 2.94 A10 10 0 1 0 21.06 7.77" stroke="#C5C5C5" stroke-width="1.75" stroke-linecap="round"/>
  <!-- Orbiting dot -->
  <circle cx="19.07" cy="4.93" r="1.9" fill="#C5C5C5"/>
  <!-- Terminal prompt > -->
  <path d="M8 8.75L11.25 12L8 15.25" stroke="#C5C5C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor -->
  <line x1="13" y1="15.25" x2="16.5" y2="15.25" stroke="#C5C5C5" stroke-width="2" stroke-linecap="round"/>
</svg>
