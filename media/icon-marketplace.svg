<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0E3B45"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Portal ring, with a gap where the orbiting dot sits -->
  <path d="M84.4 25.4 A44 44 0 1 0 102.6 43.6" fill="none" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"/>
  <!-- Orbiting dot: the terminal travels anywhere -->
  <circle cx="95.1" cy="32.9" r="7" fill="#FBBF24"/>
  <!-- Terminal prompt > -->
  <path d="M44 48 L60 64 L44 80" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor -->
  <rect x="66" y="74" width="22" height="9" rx="4.5" fill="#FBBF24"/>
</svg>
